<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <main class="hero">
      <header class="hero-login">
        <h1>LOGIN</h1>
      </header>

      <section class="form">
        <form action="explore.html" method="get">
          <label for="Username">Username</label>
          <input
            type="text"
            id="Username"
            name="Username"
            placeholder="Username"
            required
          />

          <br /><br />

          <label for="Password">Password</label>
          <input
            type="password"
            id="Password"
            name="Password"
            placeholder="Password"
            required
          />

          <button type="submit" class="button">LOGIN</button>
        </form>

        
        <div class="icons">
          <small>Login With</small><br />
          <a href="#" aria-label="Google login">
            <i class="fa-brands fa-google"></i>
          </a>
        </div>

        <div class="signin">
          <p>Back HOME</p>
          <a href="index.html"><i class="fa-notdog-duo fa-solid fa-house"></i></a>
        </div>
      </section>
    </main>
  </body>
</html>
