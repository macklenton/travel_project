<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOOK A TRIP | WILDQUEST</title>
    <link rel="stylesheet" href="css/book.css">
  </head>
  <body>
     <header>
        <div class="logo">
            <h1>WILDQUEST</h1>
        </div>
        <nav class="nav-links">
            <a href="index.html">HOME</a>
            <a href="explore.html">EXPLORE</a>
            <a href="contact.html">CONTACT</a>
            <a href="login.html">LOGIN</a>
            
        </nav>
    </header>
    <main>
      <!-- HERO SECTION -->
      <section class="hero-booking">
        <p class="heading">YOUR KENYAN ADVENTURE STARTS HERE</p>

        <h2>
          Let's Plan Your<br />
          <span>Wild Adventure</span>
        </h2>

        <p>
          Tell us what your dream trip looks like. We'll help you plan an
          unforgettable Kenyan experience.
        </p>
      </section>
      <!-- BOOKING SECTION -->
      <form class="booking-form" action="" method="post">
        <h3>
            Trip Details
        </h3>

        <div class="form-group">
          <label for="destination">Choose Destination </label>

          <select id="destination" name="destination" required>
            <option value="">Select a destination</option>
            <option value="Maasai Mara">Maasai Mara</option>
            <option value="Diani Beach">Diani Beach</option>
            <option value="Amboseli">Amboseli National Park</option>
            <option value="Mount Kenya">Mount Kenya</option>
            
          </select>
        </div>

        <div class="form-group">
          <div class="form-group">
            <label for="start-date">Travel Start Date </label>
            <input type="date" id="start-date" name="start_date" required />
          </div>

          <div class="form-group">
            <label for="end-date">Travel End Date </label>
            <input type="date" id="end-date" name="end_date" required />
          </div>
        </div>

        <div class="form-group">
          <div class="form-group">
            <label for="travellers">Number of Travellers </label>

            <select id="travellers" name="travellers" required>
              <option value="">Choose number</option>
              <option value="1">1 traveller</option>
              <option value="2">2 travellers</option>
              <option value="3">3 travellers</option>
              <option value="4">4 travellers</option>
              <option value="5">5 travellers</option>
              <option value="6+">6 or more</option>
            </select>
          </div>

          <div class="form-group">
            <label for="travel-style">Travel Style </label>

            <select id="travel-style" name="travel_style" required>
              <option value="">Choose your style</option>
              <option value="Safari">Wildlife & Safari</option>
              <option value="Beach">Beach & Relaxation</option>
              <option value="Adventure">Adventure</option>
              <option value="Family">Family Holiday</option>
              <option value="Romantic">Romantic Getaway</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="budget">Estimated Budget(KES)</label>

          <select id="budget" name="budget" required>
            <option value="">Choose your budget</option>
            <option value="under-10000">Under KES 10,000</option>
            <option value="10000-30000">KES 10,000 - 30,000</option>
            <option value="30000-60000">KES 30,000 - 60,000</option>
            <option value="60000-plus">Above KES 60,000</option>
            
          </select>
        </div>

        <div class="form-group">
          <label for="accommodation">Accommodation Preference </label>

          <select id="accommodation" name="accommodation" required>
            <option value="">Choose accommodation</option>
            <option value="camping">Camping</option>
            <option value="budget">Budget accommodation</option>
            <option value="hotel">Hotel or lodge</option>
            <option value="luxury">Luxury lodge or resort</option>
            
          </select>
        </div>

        <h3>
          
          Your Contact Details
        </h3>

        <div class="form-row">
          <div class="form-group">
            <label for="full-name">Full Name </label>

            <input
              type="text"
              id="full-name"
              name="full_name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@gmail.com"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number </label>

          <input
            type="number"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
          />
        </div>

        <button type="submit" class="submit-button">
          Send Booking Request
          
        </button>
      </form>
      <!-- FOOTER -->
      <footer class="footer" id="contact">
        <p>&copy; 2026 WILDQUEST.  All rights reserved.</p>
    </footer>
    </main>
  </body>
</html>
