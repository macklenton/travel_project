<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>TRIP BOOKED | WILDQUEST</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <link rel="stylesheet" href="css/success.css" />
  </head>

  <body>
    <main class="success-page">

      <section class="success-card">

        <!-- SUCCESS ICON -->
        <div class="success-icon" aria-label="Booking successful">
          <i class="fa-solid fa-check"></i>
        </div>

        <!-- SUCCESS MESSAGE -->
        <h1>Trip Booked Successfully!</h1>

        <p class="message">
          Thank you for choosing WILDQUEST.
          Your trip request has been successfully submitted.
        </p>

        <p class="details">
          We have received your travel details and will get in touch
          with you shortly to confirm your adventure.
        </p>

        <!-- ACTION BUTTONS -->
        <div class="action">

          <a href="explore.html" class="explore-button">
            Explore More Destinations
          </a>

          <a href="index.html" class="home-button">
            <i class="fa-solid fa-house"></i>
            Back Home
          </a>

        </div>

      </section>

    </main>
  </body>
</html>
